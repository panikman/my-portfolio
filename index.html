<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: #333;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        section {
            margin: 2rem 0;
        }
        
        h1, h2 {
            margin-bottom: 1rem;
        }
        
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
    </header>
    
    <div class="container">
        <section>
            <h2>About Me</h2>
            <p>Welcome to my portfolio. Add your content here.</p>
        </section>
        
        <section>
            <h2>Projects</h2>
            <p>Your projects will go here.</p>
        </section>
        
        <section>
            <h2>Contact</h2>
            <p>Get in touch with me.</p>
        </section>
    </div>
    
    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
